# deploy/pgbackrest/pgbackrest.conf — constants only, no secret (ADR-0064 D-H as amended by section 10.1 KEEP).
# Mounted read-only at /etc/pgbackrest/pgbackrest.conf by deploy/compose/{backup,drill}.yml.
# The only secret-valued option, the repository cipher pass, comes from the environment as
# PGBACKREST_REPO1_CIPHER_PASS (dr.env, 0600; ruling E10 / 10.11 J) and is never written here.
# One posix repository on its own fixed-size filesystem (10.11 A); retention 2 daily fulls, expired only by
# `humaux-maintenance backup run` after the new set is VERIFIED (D-V); a failing archive drops WAL past the
# queue cap instead of filling PGDATA (E15.4, CFG-queue). Six keys are pinned by T-H6.
[global]
repo1-type=posix
repo1-path=/var/lib/pgbackrest/repo
repo1-retention-full-type=count
repo1-retention-full=2
repo1-bundle=y
repo1-block=n
repo1-cipher-type=aes-256-cbc
compress-type=zst
expire-auto=n
archive-push-queue-max=2GiB
archive-async=n
process-max=1
start-fast=y
log-level-console=info
log-level-file=off

[humaux]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
