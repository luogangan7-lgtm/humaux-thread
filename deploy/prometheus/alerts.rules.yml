# §42 alert rows loaded by cards 34, 34b, 35 and 36 (ADR-0061 D-E, ADR-0062 D-S, ADR-0063 D-F). Each expression is copied literally from the
# §42 table; metric names and label keys are §41.2 rows (freezes ① and ④, checked by
# `cargo xtask metrics-registry --check` D8). The other §42 rows wait for a producer and a red
# record (freeze ②, §80.1); they are listed in ADR-0061 limits.
# Every alert here has a firing and a silent case in tests/alerts.test.yml, and one balanced token
# mutation in mutations.sh that the tests must catch.
groups:
  - name: humaux-alerts
    rules:
      # §42 "core metric absent": the runtime twin of §80.2 — a family dropped from a live exporter.
      - alert: CoreMetricAbsent
        expr: absent(humaux_retrieval_requests_total) or absent(degrade_total) or absent(humaux_mcp_requests_total)
        labels:
          severity: critical

      # §42 "projection lag exceeds SLO". No `by (stream)`: the family is unlabeled (§42 freeze ④).
      - alert: ProjectionLagExceedsSLO
        expr: max(projection_lag_events) > 100
        for: 10m
        labels:
          severity: critical

      # §42 "queue dead letter increase".
      - alert: QueueDeadLetterIncrease
        expr: delta(jobs_dead[15m]) > 0
        labels:
          severity: warning

      # §42 "backup failure": 26 h without a verified off-site pull. The producer is card 37; until
      # then the family is on metrics-registry's NOT_YET_PRODUCED allowlist and this rule is silent.
      - alert: BackupFailure
        expr: time() - backup_last_success_timestamp_seconds > 93600
        labels:
          severity: critical

      # §42 "health gauges absent" (ADR-0061 D-D, ruling E8): INV-3, the lag row and the DEAD row have
      # no absent branch, so a dead or failing `humaux-maintenance health serve` (its /metrics answers
      # 503 and the series go stale) would silence all three. Only §41.2 names, no label key.
      - alert: HealthGaugesAbsent
        expr: absent(data_disclosures_reserved_unfinalized) or absent(jobs_dead) or absent(projection_lag_events)
        for: 2m
        labels:
          severity: critical

      # §42 "no-output stage" (card 34b): distill runs finish while no memory record is written — the
      # stage is alive but produces nothing (same shape as §53.5 INV-1). Both families are exported by
      # humaux-private-worker (ADR-0061 D-C); the row gives no `for:`.
      - alert: DistillNoOutput
        expr: increase(private_distill_runs_total[1h]) > 0 and increase(private_distill_outputs_total[1h]) == 0
        labels:
          severity: critical

      # §42.1 heartbeat: always firing, routed alone to the external dead-man receiver
      # (alertmanager.yml). Its payload carries external_labels.git_sha (prometheus.yml).
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none

      # §42 "maintenance task failing" (card 35, ADR-0062 D-S, ruling E3): a scheduled maintenance door call
      # failed in the last hour. Exported only by `humaux-maintenance --serve` (ADR-0061 D-C); `outcome` is the
      # §41.2 closed set ok | failed. While a failure lasts `/metrics` answers 503 (ADR-0062 D-A), so no sample is
      # scraped: this row is the record read on the first clean scrape after recovery, and the live signal is
      # MaintenanceCountersAbsent below.
      - alert: MaintenanceTaskFailing
        expr: increase(maintenance_task_runs_total{outcome="failed"}[1h]) > 0
        labels:
          severity: warning

      # §42 "maintenance counters absent" (card 35 fix pass, ADR-0062 D-S): the daemon is dead, never scraped, or
      # answering 503 (a failed door call, an unreachable database, no cycle finished yet) — a failed scrape marks
      # its series stale. The HealthGaugesAbsent shape for the eighth ops pair; only a §41.2 name, no label key.
      - alert: MaintenanceCountersAbsent
        expr: absent(maintenance_task_runs_total)
        for: 2m
        labels:
          severity: warning

      # §42 "partition horizon short" (card 36, ADR-0063 D-F): the §48.1 tables have no DEFAULT partition, so the
      # first insert past the last pre-created month fails with 23514 for every tenant at once — and most
      # repositories map 23514 to 409/400 (ADR-0063 L15), so the outage itself is invisible to 5xx monitoring. These
      # three rows are the alarm. `partition_horizon_months{table}` is exported by `humaux-maintenance --serve`'s
      # PARTITIONS task: 3 right after the monthly `retention create-partitions --months-ahead 3`, 2 during the
      # following month, <= 1 after one missed run (two months before the outage); -1 for a table with no leaf.
      - alert: PartitionHorizonShort
        expr: min by (table) (partition_horizon_months) <= 1
        for: 1h
        labels:
          severity: warning

      # §42 "partition horizon exhausted" (ADR-0063 D-F): the current month's leaf is the last one (or the table has
      # none), so inserts fail from 00:00 UTC on the next 1st. `for: 600s` is §42's 10m, spelled so the `lag` row
      # of mutations.sh keeps the only 10-minute `for:` token of this file.
      - alert: PartitionHorizonExhausted
        expr: min by (table) (partition_horizon_months) <= 0
        for: 600s
        labels:
          severity: critical

      # §42 "partition horizon absent" (ADR-0063 D-F / D-K): PARTITIONS never succeeded since boot or its last run
      # failed — a failed run removes every series of the family instead of keeping the last value — or the daemon
      # is not scraped. The HealthGaugesAbsent shape; only a §41.2 name, no label key.
      - alert: PartitionHorizonAbsent
        expr: absent(partition_horizon_months)
        for: 2h
        labels:
          severity: critical
