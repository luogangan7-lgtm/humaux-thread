# ADR-0050 D-G, amended 2026-10-03 (Baseline 2.9 §70: Rust 1.99 / Edition 2024). The exact patch version is pinned so
# "`rustc --version` matches this file" is a string comparison. Installed explicitly with
# `rustup toolchain install 1.99.0 --profile minimal -c clippy -c rustfmt`.
[toolchain]
channel = "1.99.0"
components = ["clippy", "rustfmt"]
profile = "minimal"
