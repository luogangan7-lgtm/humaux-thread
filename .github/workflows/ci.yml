name: CI
# §46 "Repository 第一天启用" + §46.1 G46-1/G80-37 Migration Rehearsal Contract.
# Main branch 不允许红（§46）. Tri-state semantics per §57.1:
#   rule 2: not_applicable 必须打印缺失对象名，不许「扫不到当通过」。
#   rule 3: 依赖运行时基础设施的项（retrieval benchmark / mutation tests /
#           deploy smoke / container scan）Phase 0 无被测对象，输出
#           not_applicable —— 不注释掉、不假绿。
#
# §79.2「跳过不等于通过」——这一条本 workflow 曾经违反过，实测：此前没有任何
# services 段，于是全 workspace **99 个**依赖真库的测试（RLS / SKIP LOCKED 并发 /
# fencing token / outbox 原子性 / 跨租户隔离 / read-your-writes）每次都走可见 SKIP
# 分支，而 `cargo test --workspace` 一路绿灯 —— 绿得毫无信息量。
# 下面的 services 段补上被测对象；`HUMAUX_REQUIRE_DB` / `HUMAUX_REQUIRE_QDRANT`
# 则是防复发的那一半：**声明**了有依赖之后，任何一次跳过都是环境故障、当场变红。
# 删掉 services 段的那次提交会立刻红，而不是三个月后有人发现 RLS 从没被测过。

# Triggers (main line 2026-10-07): the repository went public on GitHub so the
# RAM-heavy part of the gate chain (cargo test --workspace + xtask gates) runs on a
# 16 GB hosted runner instead of the shared 6 GiB Docker VM on the dev Mac. Pushes
# to main and ci/** branches run it; workflow_dispatch is for re-runs.
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

# One run per ref: a newer push supersedes the one still queued (free-tier
# concurrency is shared with the owner's other repositories).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt + check + clippy + test + gates
    # Pinned image, not ubuntu-latest: a runner image upgrade must not change what
    # the chain proves. linux/arm64 because §67.2 freezes the production host on ARM and
    # the card-37 scratch images (deploy/images/postgres, qdrant by digest) are pinned
    # --platform linux/arm64: on an x64 runner their builds fail with exit 255 (run
    # 37615291083). 4 vCPU / 16 GB, free on public repositories.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150

    # 被测对象。版本与本机开发环境逐一对齐（postgres:18 / qdrant v1.19.0）——
    # 版本漂移会让 CI 证明的东西和开发机证明的东西不是同一个。
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          # testkit::fixture_purge refuses any database whose name does not start with
          # `humaux_thread_` (the local-disposable predicate the e2e-seed binding rule uses).
          # On `postgres` every fixture tenant stayed behind and the I-SLOT probe of
          # distill_dispatch_v2 grew red with each test (run 37613916837).
          POSTGRES_DB: humaux_thread_ci
        ports:
          - 5432:5432
        # 没有 health check 的话，migrate 会在库还没起来时抢跑，红得莫名其妙。
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
          - 6334:6334

    env:
      # ADR-0059 D-A: `migrate` refuses to create a 0011 role with the repository
      # placeholder password, so a fresh cluster is provisioned the way production is
      # (runbook §2) in the step below. The migrate principal is the service superuser:
      # outside the §6.2.0 role set, which is what MigratorDbPool::connect requires.
      HUMAUX_TEST_PG_DSN: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      HUMAUX_MIGRATOR_PG_DSN: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      # 声明「本次运行有这两个依赖」⇒ 此后任何跳过都是环境故障（见头部注释）。
      HUMAUX_REQUIRE_DB: "1"
      HUMAUX_REQUIRE_QDRANT: "1"
      # REST port of the qdrant service above (tests default to 6333; stated here so
      # the service block and the tests cannot drift apart silently).
      HUMAUX_TEST_QDRANT_PORT: "6333"

    steps:
      # partitions.rs::registry_survives_a_logical_dump_and_restore execs pg_dump / pg_restore
      # inside the container named `humaux-thread-pg` (the dev container); the service
      # container gets a generated name, so it is renamed once it is up.
      - name: name the postgres service like the dev container
        run: docker rename "${{ job.services.postgres.id }}" humaux-thread-pg

      - uses: actions/checkout@v4
        with:
          # contract-impact needs `git diff --name-only <base>` against the PR's real merge
          # base (§80.3) — the default shallow (depth-1) checkout has no base commit to diff
          # against at all.
          fetch-depth: 0

      # Toolchain, cache, gitleaks fixture and the runbook §2 cluster provisioning live in one
      # composite action so the `live` job below provisions its cluster the same way.
      - uses: ./.github/actions/setup

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo check --all-targets
        run: cargo check --workspace --all-targets

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --no-fail-fast: one run shows every red binary, not just the first (§57.1 rule 2:
      # a stop at the first failure hides the rest behind it).
      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      # The CI twin of the local gate `no_leaked_distill_jobs` (TW c31_leak_check.sh) plus the
      # ADR-0058 §2.1 I-SLOT probe over the whole table: a test binary that leaves claimable
      # or half-claimed DERIVED_* jobs behind breaks every later binary that asserts the
      # invariant, and the leak must be named by tenant, not guessed. Always runs so a red
      # `cargo test` still gets its diagnosis.
      - name: no_leaked_distill_jobs + I-SLOT probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          q() { docker exec "${{ job.services.postgres.id }}" psql -U postgres -d humaux_thread_ci -Atc "$1"; }
          leaked=$(q "select t.name || ' ' || j.job_type || ' tenants=' || count(distinct j.tenant_id) || ' jobs=' || count(*) from ops.jobs j join control.tenants t using (tenant_id) where j.job_type in ('DERIVED_DISTILL','DERIVED_CONSOLIDATE') and j.status = 'PENDING' and t.name like '%throwaway tenant%' group by t.name, j.job_type order by count(*) desc")
          ckpt=$(q "select c.domain || '/' || c.projection_kind || ' tenants=' || count(distinct c.tenant_id) || ' checkpoints=' || count(*) from projection.stream_checkpoints c where (c.domain, c.projection_kind) not in (('private_memory','PRIVATE_MEMORY')) group by c.domain, c.projection_kind order by count(*) desc")
          islot=$(q "select coalesce(t.name, '<no tenant row>') || ' | ' || j.status || ' | ' || coalesce(j.dispatch_state, '-') || ' | gen=' || j.claim_generation || ' | slots=' || (select count(*) from ops.provider_slots s where s.job_id = j.job_id and s.claim_generation = j.claim_generation) || ' | created=' || j.created_at from ops.jobs j left join control.tenants t using (tenant_id) where j.job_type = 'DERIVED_DISTILL' and j.status = 'PROCESSING' and j.dispatch_state is not null and (select count(*) from ops.provider_slots s where s.job_id = j.job_id and s.claim_generation = j.claim_generation) <> 1 order by j.created_at")
          slots=$(q "select slot_id || ' job=' || coalesce(job_id::text, '-') || ' gen=' || coalesce(claim_generation::text, '-') from ops.provider_slots order by 1")
          echo "provider_slots:"; echo "$slots"
          rc=0
          if [ -n "$leaked" ]; then echo "no_leaked_distill_jobs: FAIL (claimable derived jobs on throwaway tenants)"; echo "$leaked"; rc=1; fi
          if [ -n "$ckpt" ]; then echo "no_leaked_distill_jobs: FAIL (stream_checkpoints outside the registered pair)"; echo "$ckpt"; rc=1; fi
          if [ -n "$islot" ]; then echo "i_slot: FAIL (PROCESSING DERIVED_DISTILL rows without exactly one slot)"; echo "$islot"; rc=1; fi
          [ $rc -eq 0 ] && echo "no_leaked_distill_jobs: pass; i_slot: pass"
          exit $rc

      - name: contribution ignored integration tests
        run: |
          cargo test -p humaux-adapters --test contribution_scan -- --ignored --test-threads=1
          cargo test -p humaux-adapters --test contribution_pipeline -- --ignored --test-threads=1
          cargo test -p humaux-adapters --test contribution_authorization -- --ignored --test-threads=1
          cargo test -p humaux-adapters --test contribution_reasoner -- --ignored --test-threads=1
          cargo test -p humaux-adapters --test public_provenance -- --ignored --test-threads=1
          cargo test -p humaux-adapters --test public_trust -- --ignored --test-threads=1
          cargo test -p humaux-adapters --test public_provenance_revocation_eval -- --ignored --test-threads=1

      - name: G80-45/DOD-054 public anonymous topology
        run: cargo test -p humaux-adapters --test public_runtime assessed_anonymous_lifecycle_tracks_supported_revision_and_revocation_fails_closed -- --ignored --exact --test-threads=1

      - name: cargo xtask architecture-check
        run: cargo xtask architecture-check

      - name: cargo xtask mechanism-registry
        run: cargo xtask mechanism-registry

      - name: cargo xtask config-check
        run: cargo xtask config-check

      # §80.3: the base is the PR merge base, or on a push the merge base with main
      # (`github.event.before` is all zeros on a branch's first push). Computed in its own
      # step because contract_impact.rs's unit test pins the shape of the next line:
      # one `run: cargo xtask contract-impact … --base` line, never a multi-line script.
      - name: contract-impact base
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            git fetch -q origin main
            base="$(git merge-base origin/main HEAD)"
          fi
          echo "CONTRACT_IMPACT_BASE=$base" >> "$GITHUB_ENV"
      - name: cargo xtask contract-impact
        run: cargo xtask contract-impact --base ${{ env.CONTRACT_IMPACT_BASE }}

      - name: cargo xtask migration-rehearsal
        run: cargo xtask migration-rehearsal

      # 以下六道此前一道都没接进 CI —— 它们本地全绿，但「本地绿」不是判据，
      # 没在 CI 跑过的闸等于没有人在看。rls-check 需要真库，上面的 services 已提供。
      - name: cargo xtask metrics-registry
        run: cargo xtask metrics-registry

      - name: cargo xtask gate-registry
        run: cargo xtask gate-registry

      - name: cargo xtask r4-fault-manifest
        run: cargo xtask r4-fault-manifest

      - name: cargo xtask threshold-shape
        run: cargo xtask threshold-shape

      - name: cargo xtask direction-table
        run: cargo xtask direction-table

      - name: cargo xtask card-version
        run: cargo xtask card-version

      - name: cargo xtask rls-check
        run: cargo xtask rls-check

      # PHASE 真源的过期闸：下一相位的交付物 marker 已非占位而 PHASE 未前进 ⇒ 红。
      # 「当前状态」型常量写进静态文件的那天就开始腐烂，除非配一道会红的过期闸——
      # PHASE 文件正是那种常量（审计结论，见 xtask/src/phase.rs 模块 doc）。
      - name: cargo xtask phase-check
        run: cargo xtask phase-check

      # ---------------------------------------------------------------------
      # 还没接进来的两道，以及为什么 —— 写在这里是为了留痕，不是为了免责。
      #
      #   cargo xtask dod-check
      #   cargo xtask benchset-declaration
      #
      # 相位真源已修（PHASE 文件 + xtask/src/phase.rs）：两道闸不传参数即按真实相位判，
      # 「默认 0 豁免一切」已不存在。但按真实相位它们当前是红的：
      #   · dod-check --phase 7  → 9 pass / 40 fail / 50 na，40 条全是
      #     「no verifier registered」——§69 要求的 DoD→verifier→注错三段绑定，
      #     94 条里只登记了 5 条（crates/testkit/src/dod.rs 模块注释自陈「Phase 0 only」）。
      #   · benchset-declaration（PHASE=8 实跑）→ 5 个集合 owning phase 已到期仍
      #     NOT_DECLARED（continuation_198_v2 / longmemeval_style / agent_workflow_outcome /
      #     project_continuity / memory_security_lifecycle），缺的是**实测**数据，不能估。
      #     exact_completeness 已于 2026-08-27 实测声明（evals/exact_completeness/ +
      #     crates/adapters/tests/exact_completeness_eval.rs），从红名单摘除。
      #
      # 接的前提是先把缺口补上，而不是把相位调低到让它们变绿——那正是 §80.1.2
      # 批评已退休 G80-21 时说的「调松定义」。补完这两块即在此处接上，并把相位值
      # 从一处真源读取而不是写死在这个文件里。
      # ---------------------------------------------------------------------

      - name: cargo-deny check (§78.5)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features

      # §46 Day-1 list / §57.1 Phase-0 gate row require SBOM to PASS (not
      # not_applicable): it is generated statically from Cargo.lock, no live
      # infrastructure needed, so it does not qualify for the tri-state
      # not_applicable exception in §57.1 rule 3.
      - name: SBOM (cargo-sbom, §46)
        run: |
          cargo install cargo-sbom --locked
          cargo sbom --output-format=spdx_json_2_3 > sbom.spdx.json

      # §57.1 第3条: 依赖运行时基础设施（vector store / mutation harness / live
      # deploy target / image registry），Phase 0 尚无被测对象。按三态输出
      # not_applicable 并点名缺失对象，不是注释掉这些步骤、也不是假装它们通过。
      - name: retrieval benchmark (not_applicable — Phase 0)
        run: 'echo "not_applicable (missing object: retrieval benchmark corpus / embedding index — delivered Phase 6, §57.1 rule 3)"'

      - name: mutation tests (not_applicable — Phase 0)
        run: 'echo "not_applicable (missing object: mutation harness / testkit fault targets — delivered Phase 1, §57.1 rule 3)"'

      - name: deploy smoke (not_applicable — Phase 0)
        run: 'echo "not_applicable (missing object: live deploy target with /live /ready /status — delivered Phase 14, §57.1 rule 3)"'

      - name: container scan (not_applicable — Phase 0)
        run: 'echo "not_applicable (missing object: container image to scan — delivered Phase 14, §57.1 rule 3)"'

  # Real-provider tests (the local chain's distill_hop_live / distill_fairness_live /
  # distill_poison_live / two_provider_live / consolidation hop / dashscope_live_smoke).
  # Keys come from the `minimax m3` environment the owner created (ALIBABA_CLOUD_API_KEY,
  # MINIMAXAPIKEY); they are mapped onto the names the code reads and never printed.
  # Each run spends provider money, so it runs on pushes to main and on manual dispatch
  # only, never on PRs or ci/** pushes. DNS pins are omitted: the pins exist for the dev
  # Mac's proxy fake-IP resolver (ADR-0039 / ADR-0060) and are optional in every test.
  live:
    name: live providers (MiniMax + DashScope)
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: minimax m3
    services:
      postgres:
        image: postgres:18
        env:
      HUMAUX_TEST_PG_DSN: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      HUMAUX_MIGRATOR_PG_DSN: postgres://postgres:ci@127.0.0.1:5432/humaux_thread_ci
      HUMAUX_REQUIRE_DB: "1"
      HUMAUX_REQUIRE_QDRANT: "1"
      HUMAUX_TEST_QDRANT_PORT: "6333"
      HUMAUX_REQUIRE_MINIMAX: "1"
      HUMAUX_REQUIRE_SECOND_PROVIDER: "1"
      HUMAUX_REQUIRE_DASHSCOPE: "1"
      MINIMAX_API_KEY: ${{ secrets.MINIMAXAPIKEY }}
      DASHSCOPE_API_KEY: ${{ secrets.ALIBABA_CLOUD_API_KEY }}
      # ADR-0060 canonical second-provider set (values are not secrets; the key is the
      # variable HUMAUX_LIVE_P2_KEY_ENV names).
      HUMAUX_LIVE_P2_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      HUMAUX_LIVE_P2_HOSTS: dashscope.aliyuncs.com
      HUMAUX_LIVE_P2_MODEL: qwen-plus
      HUMAUX_LIVE_P2_CAPABILITIES: TEXT,STRUCTURED_OUTPUT,TOOL_CALLS,JSON_OBJECT
      HUMAUX_LIVE_P2_REQUEST_EXTRAS: '{"enable_thinking":false}'
      HUMAUX_LIVE_P2_KEY_ENV: DASHSCOPE_API_KEY
      HUMAUX_LIVE_P2_PROVIDER_ID: dashscope
      HUMAUX_LIVE_P2_REGION: cn-beijing
      HUMAUX_LIVE_P2_EGRESS_PROCESSOR_ID: 5cc23460-f4b8-4ca6-8c11-9d5fc4b96cec
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: distill hop (private worker, MiniMax)
        run: cargo test -p humaux-private-worker --test distill_hop_e2e -- --include-ignored

      - name: derived dispatch live tests (fairness, poison, two providers, channel A/B)
        run: cargo test -p humaux-private-worker --test derived_dispatch_e2e -- --include-ignored live

      - name: consolidation hop (MiniMax)
        run: cargo test -p humaux-consolidation-worker --test consolidation_hop_e2e -- --include-ignored

      - name: dashscope live smoke (retrieval provider)
        run: cargo test -p humaux-retrieval-provider --test dashscope_live_smoke -- --include-ignored
