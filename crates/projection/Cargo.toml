[package]
name = "humaux-projection"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# T3.3+T3.4 (§15.1/§15.4) `stream::StreamKey` wraps `humaux_domain::ids::TenantId` (reuse,
# not a second tenant-id type) and needs `Uuid` for `scope_id`/`stream_key_text` encoding —
# no new feature flags beyond the crate's own default (Display/FromStr only, no `v7` minting
# here: this module never mints an id, only carries and formats one).
humaux-domain = { path = "../domain" }
uuid = "1.25.0"
# T5.1 (§16.1.1/G80-11): fingerprint::source_hash hashes the canonical processing-input
# encoding. Same `sha2 = "0.11"` line every other workspace crate already carries
# (humaux-domain::evidence::payload_sha256, humaux-contracts::config_registry, etc.) — no
# new crate introduced to the dependency graph.
sha2 = "0.11"
