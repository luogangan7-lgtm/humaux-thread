[package]
name = "humaux-application"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Phase 2 identity/entitlement modules (§74/§75/§76). Versions: latest stable.
humaux-domain = { path = "../domain" }
# §25.3 continuity：assemble_handoff 产出 retrieval::handoff::Handoff（G80-31 字节域）。
# retrieval 只依赖 domain+telemetry，无环。
humaux-retrieval = { path = "../retrieval" }
argon2 = "0.5"
rand = "0.9"
# §74.2/§73.5: HMAC-SHA256 keyed hash for verification codes, same construction and version
# pins as `crates/protocol` already resolved for `control.api_keys.key_hash` — reused, not a
# second independent version in the dependency graph.
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# T4.6/T4.7 §11.8: `PrivateReasoningPort` is the spec's own verbatim code block, `#[async_trait]`
# included — same macro already resolved in the workspace lockfile via `humaux-adapters`'s
# `email::EmailProvider` trait (its Cargo.toml doc explains the object-safety reason: a plain
# `async fn` in a trait is not `dyn`-compatible, and callers need `&dyn PrivateReasoningPort`).
async-trait = "0.1"
# `consolidate::PrivateReasoningDomainId`'s inner id — same pin as `humaux-domain`'s existing
# `uuid = "1.25.0"`, no new independent version in the dependency graph.
uuid = "1.25.0"

[dev-dependencies]
# T4.6/T4.7 `consolidate.rs` tests: `PrivateReasoningPort::infer` is `async fn`, so its fake
# in-crate test double needs an executor. Matches `crates/adapters`'s existing `tokio`
# dev-dependency version pin (that crate drives its async fixtures via `Runtime::block_on`
# instead of this macro — either is fine, `#[tokio::test]` is simply the smaller diff for a
# single self-contained async test with no cross-test runtime sharing to worry about).
tokio = { version = "1", features = ["macros", "rt"] }
