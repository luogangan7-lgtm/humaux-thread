[package]
name = "xtask"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# §46.1 manifest parsing (migration_rehearsal.rs) — no serde derive needed, toml::Value suffices.
toml = "1"
# §50.1 config-check.rs: reuses contracts::feature_registry parsing, no second parser.
humaux-contracts = { path = "../crates/contracts" }
humaux-adapters = { path = "../crates/adapters" }
tokio = { version = "1", features = ["rt-multi-thread"] }
# Parsing `cargo metadata` output for dependency-rule checks (§78.3) and gate reports.
serde_json = "1"
# Phase 1: migration runner (migrate.rs) + live-DB enumerations (rls_check.rs, §48.2).
postgres = { version = "0.19", features = ["with-uuid-1"] }
# e2e-seed.rs: same Uuid type postgres::Client's with-uuid-1 feature binds against.
uuid = { version = "1.25.0", features = ["v4"] }
# T5.8 card_version.rs: calls the real `projection::card::{assemble, CARD_TEMPLATE_HASH,
# template_fingerprint}` instead of re-deriving/hardcoding a second copy of the template shape
# — reuse, not a second implementation to keep in sync by hand.
humaux-projection = { path = "../crates/projection" }
# e2e-seed.rs: reuses the real keyed-hash function instead of re-deriving it (§73.5, binding rule).
humaux-protocol = { path = "../crates/protocol" }
# e2e-seed.rs: TenantId/UserId/WorkspaceId newtypes for quota_repo::issue_window's signature.
humaux-domain = { path = "../crates/domain" }
# e2e-seed.rs: 32-char alphanumeric secret generation (getrandom-backed, workspace's existing line).
rand = "0.9"
# e2e-seed.rs 追加2: Qdrant collection provisioning reuses the real IntraCellResource::QDRANT_REST
# transport instead of a hand-rolled HTTP client (§83.4/ADR-0003 — Qdrant is same-Cell, not egress).
humaux-infra-cell = { path = "../crates/infra-cell" }
