# §46.1 migration manifest. ADR-0030 (Card E1, §8.5.1 affect annotation axis — write-side
# carrier): one new private table private.evidence_affects (FORCE RLS, tenant + parent-Evidence
# policy, owner role_migration_owner, NAMED §6.2.2 grants: gateway SELECT+INSERT,
# private_worker/maintenance SELECT, nobody UPDATE/DELETE), the 0156 immutability trigger reused on
# it, and one SECURITY INVOKER AFTER INSERT trigger (+ its function) on private.memory_evidence
# copying a PRIMARY Evidence's affect rows onto the newborn memory. No DML; no existing object
# altered. §46 forward-fix (EXPAND_CONTRACT, next free number after 0156).

migration_id = "0157_evidence_affects"
class = "EXPAND_CONTRACT"

precheck = """
select to_regclass('private.memory_affects') is not null
 and to_regclass('private.memory_evidence') is not null
 and to_regprocedure('private.reject_memory_affect_update()') is not null
 and to_regclass('private.evidence_affects') is null
 and to_regprocedure('private.memory_affects_inherit_from_evidence()') is null
 as precheck_ok
"""

postcheck = """
select
 (select count(*)=1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
   where n.nspname='private' and c.relname='evidence_affects'
     and c.relrowsecurity and c.relforcerowsecurity
     and pg_get_userbyid(c.relowner)='role_migration_owner')
 and (select count(*)=1 from pg_policies where schemaname='private' and tablename='evidence_affects'
       and qual like '%humaux.tenant_id%' and with_check like '%humaux.tenant_id%')
 -- every FK except the tenant FK carries the tenant leg and cascades
 and (select bool_and(array_length(conkey,1) >= 2 and confdeltype='c') from pg_constraint
       where contype='f' and conrelid='private.evidence_affects'::regclass
         and confrelid <> 'control.tenants'::regclass)
 and (select count(*)=2 from pg_constraint
       where contype='f' and conrelid='private.evidence_affects'::regclass
         and confrelid <> 'control.tenants'::regclass)
 -- same closed sets + range CHECKs as memory_affects (§78.2 DB<->Rust contract surface)
 and (select count(*)>=8 from pg_constraint where contype='c' and conrelid='private.evidence_affects'::regclass)
 -- immutability trigger reuses the 0156 owner function
 and exists(select 1 from pg_trigger where tgname='evidence_affects_immutable'
             and tgrelid='private.evidence_affects'::regclass and not tgisinternal
             and tgfoid='private.reject_memory_affect_update()'::regprocedure)
 -- copy hook: owner function, SECURITY INVOKER, PRIMARY-only AFTER INSERT trigger on memory_evidence
 and (select count(*)=1 from pg_proc p
       where p.oid='private.memory_affects_inherit_from_evidence()'::regprocedure
         and not p.prosecdef and pg_get_userbyid(p.proowner)='role_migration_owner')
 and exists(select 1 from pg_trigger where tgname='memory_affects_inherit_from_evidence'
             and tgrelid='private.memory_evidence'::regclass and not tgisinternal
             and tgfoid='private.memory_affects_inherit_from_evidence()'::regprocedure)
 -- NAMED §6.2.2 grants
 and has_table_privilege('role_gateway','private.evidence_affects','INSERT')
 and has_table_privilege('role_private_worker','private.evidence_affects','SELECT')
 and not has_table_privilege('role_private_worker','private.evidence_affects','INSERT')
 and has_table_privilege('role_maintenance','private.evidence_affects','SELECT')
 and not has_table_privilege('role_maintenance','private.evidence_affects','INSERT')
 and not has_table_privilege('role_gateway','private.evidence_affects','UPDATE')
 and not has_table_privilege('role_gateway','private.evidence_affects','DELETE')
 and not has_table_privilege('role_retrieval_worker','private.evidence_affects','SELECT')
 and not has_table_privilege('role_consolidation_worker','private.evidence_affects','SELECT')
 and not has_table_privilege('role_public_worker','private.evidence_affects','SELECT')
 and not has_table_privilege('role_batch_issuer','private.evidence_affects','SELECT')
 and not has_table_privilege('role_admin','private.evidence_affects','SELECT')
 as postcheck_ok
"""

rollback_or_forward_fix = "Forward fix after deployment. evidence_affects rows are declarations re-issuable from their callers' inputs; a forward migration may drop the memory_evidence trigger, its function, the evidence_affects trigger and the table in that order if the card is reverted. Grants are only ever narrowed by a later migration."
backup_restore_requirement = "none (new empty table + triggers/grants; no existing row or policy is touched)."
