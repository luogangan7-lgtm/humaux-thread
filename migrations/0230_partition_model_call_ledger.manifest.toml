# §46.1 migration manifest. Card 36 S5 / ADR-0063 D-B, D-D: ops.model_call_ledger converted to a RANGE (called_at)
# parent with one leaf adopted from the heap and the current UTC month plus 3 pre-created; its five inbound FKs
# re-pointed to ops.model_call_identity; the former UNIQUEs moved to it, enforced by the claim trigger, which raises
# 23505 on any duplicate (ruling E3-b; the writers dedupe under the model-call-request advisory lock).
# ADR-0063 D-D 7b: catalog-only checks through to_regclass text lookups, so migration-rehearsal can EXPLAIN them
# against HEAD; the row-count, identity-count and fingerprint comparisons are the body's own last DO block (7a).

migration_id = "0230_partition_model_call_ledger"
class = "FORWARD_ONLY"

# Refuses unless ops.model_call_ledger is still a plain heap that no view or BEGIN ATOMIC body depends on, exactly the
# five referencers' FKs point at it, the one function taking its rowtype is 0133's authority check (rebound by the
# body), and the 0224 creator exists. Orphan counts per FK are the body's own first DO
# block (it names the FK and the count).
precheck = """
select coalesce((select c.relkind = 'r' from pg_class c where c.oid = to_regclass('ops.model_call_ledger')), false)
 and to_regprocedure('control.partition_create_month(text,timestamptz)') is not null
 and not exists (select 1 from pg_depend d
                  where d.refobjid = to_regclass('ops.model_call_ledger')
                    and d.classid in ('pg_rewrite'::regclass, 'pg_proc'::regclass))
 and (select array_agg(co.conname::text order by co.conname) from pg_constraint co
       where co.contype = 'f' and co.confrelid = to_regclass('ops.model_call_ledger') and co.conparentid = 0)
     = array['contribution_candidates_reasoning_model_call_exact_fk',
             'contribution_executions_assessment_model_call_fk', 'contribution_executions_coverage_model_call_fk',
             'data_disclosures_reasoning_model_call_fk', 'retrieval_provider_budget_reservations_model_call_fk']
 and (select array_agg(d.objid::regprocedure::text) from pg_depend d
       where d.refclassid = 'pg_type'::regclass and d.classid <> 'pg_type'::regclass
         and d.refobjid = (select c.reltype from pg_class c where c.oid = to_regclass('ops.model_call_ledger')))
     = array['private.assert_current_contribution_reservation_authority(ops.model_call_ledger)']
 and to_regclass('ops.model_call_identity') is null
 as precheck_ok
"""

# Fails on: not a RANGE parent; a DEFAULT partition; a leaf not owned by role_migration_owner, without RLS + FORCE,
# with a policy set other than the parent's, or with any ACL entry for another role (table or column); registry
# ATTACHED rows not equal to pg_inherits; a horizon short of the current UTC month + 4; an FK into the parent; the five
# referencer FKs not on ops.model_call_identity; the identity table without RLS + FORCE or with a runtime grant; the
# parent without its identity FK, the claim trigger or a legacy trigger; the authority check not on the parent's
# rowtype.
postcheck = """
select
 coalesce((select c.relkind = 'p' from pg_class c where c.oid = to_regclass('ops.model_call_ledger')), false)
 and (select count(*) >= 4 from pg_inherits i where i.inhparent = to_regclass('ops.model_call_ledger'))
 and not exists (
       select 1 from pg_inherits i join pg_class l on l.oid = i.inhrelid
        where i.inhparent = to_regclass('ops.model_call_ledger')
          and (pg_get_expr(l.relpartbound, l.oid) = 'DEFAULT'
               or not l.relrowsecurity or not l.relforcerowsecurity
               or pg_get_userbyid(l.relowner) <> 'role_migration_owner'
               or exists (select 1 from aclexplode(coalesce(l.relacl, acldefault('r', l.relowner))) x
                           where x.grantee <> l.relowner)
               or exists (select 1 from pg_attribute a, aclexplode(a.attacl) x where a.attrelid = l.oid)
               or (select array_agg(format('%s %s %s %s %s %s', p.polname, p.polcmd, p.polpermissive, p.polroles,
                                           pg_get_expr(p.polqual, i.inhparent), pg_get_expr(p.polwithcheck, i.inhparent))
                                    order by p.polname)
                     from pg_policy p where p.polrelid = l.oid)
                  is distinct from
                  (select array_agg(format('%s %s %s %s %s %s', p.polname, p.polcmd, p.polpermissive, p.polroles,
                                           pg_get_expr(p.polqual, p.polrelid), pg_get_expr(p.polwithcheck, p.polrelid))
                                    order by p.polname)
                     from pg_policy p where p.polrelid = to_regclass('ops.model_call_ledger'))))
 and (select array_agg(i.inhrelid order by i.inhrelid) from pg_inherits i
       where i.inhparent = to_regclass('ops.model_call_ledger'))
     = (select array_agg(r.leaf_oid order by r.leaf_oid) from control.partition_registry r
         where r.table_key = 'MODEL_CALL_LEDGER' and r.state = 'ATTACHED')
 and (select max(r.upper_bound) from control.partition_registry r
       where r.table_key = 'MODEL_CALL_LEDGER' and r.state = 'ATTACHED')
     >= date_add(date_trunc('month', now(), 'UTC'), interval '4 months', 'UTC')
 and not exists (select 1 from pg_constraint co
                  where co.contype = 'f' and co.confrelid = to_regclass('ops.model_call_ledger'))
 and (select array_agg(format('%s %s', co.conrelid::regclass, co.conname) order by co.conname)
        from pg_constraint co
       where co.contype = 'f' and co.confrelid = to_regclass('ops.model_call_identity') and co.conparentid = 0)
     = array['staging.contribution_candidates contribution_candidates_reasoning_model_call_exact_fk',
             'private.contribution_executions contribution_executions_assessment_model_call_fk',
             'private.contribution_executions contribution_executions_coverage_model_call_fk',
             'ops.data_disclosures data_disclosures_reasoning_model_call_fk',
             'ops.model_call_ledger model_call_ledger_model_call_id_fkey',
             'ops.retrieval_provider_budget_reservations retrieval_provider_budget_reservations_model_call_fk']
 and coalesce((select c.relrowsecurity and c.relforcerowsecurity
                 and not exists (select 1 from aclexplode(coalesce(c.relacl, acldefault('r', c.relowner))) x
                                  where x.grantee <> c.relowner)
                 from pg_class c where c.oid = to_regclass('ops.model_call_identity')), false)
 and (select array_agg(t.tgname::text order by t.tgname) from pg_trigger t
       where t.tgrelid = to_regclass('ops.model_call_ledger') and not t.tgisinternal)
     = array['contribution_reservation_authority_validate', 'model_call_ledger_guard_mutation',
             'model_call_ledger_private_disclosure_present', 'model_call_ledger_reject_truncate',
             'reasoning_model_call_validate', 'zz_model_call_identity_claim']
 and to_regprocedure('private.assert_current_contribution_reservation_authority(ops.model_call_ledger)') is not null
 and (select count(*) = 1 from pg_proc p where p.proname = 'assert_current_contribution_reservation_authority')
 as postcheck_ok
"""

rollback_or_forward_fix = "Forward fix only (FORWARD_ONLY, §46.1; no fake down migration). Before COMMIT any failure rolls the single transaction back and leaves the heap untouched. After COMMIT: restore the pre-apply pg_dump into a fresh database and swap names (ADR-0063 D-M runbook), or a forward migration."
