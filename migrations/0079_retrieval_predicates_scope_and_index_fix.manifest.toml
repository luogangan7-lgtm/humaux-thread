  and (select enumerable_scope from control.retrieval_predicates where predicate_id = 'rejected_decisions_v1')
      = 'private.memory_records WHERE visibility_workspace_id = $1'
  as precheck_ok
"""

postcheck = """
select
  exists (
    select 1 from pg_indexes
    where schemaname = 'private' and tablename = 'memory_records'
      and indexname = 'idx_memory_records_rejected_decisions_v1_cols'
  )
  and (select enumerable_scope from control.retrieval_predicates where predicate_id = 'rejected_decisions_v1')
      = 'private.memory_records WHERE tenant_id = $1 AND visibility_workspace_id = $2'
  as postcheck_ok
"""

rollback_or_forward_fix = """
rollback:
DROP INDEX IF EXISTS private.idx_memory_records_rejected_decisions_v1_cols;
UPDATE control.retrieval_predicates SET enumerable_scope = 'private.memory_records WHERE visibility_workspace_id = $1' WHERE predicate_id = 'rejected_decisions_v1';
"""

