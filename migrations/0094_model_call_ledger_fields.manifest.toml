# ③) + an append-only/one-shot-finalize guard trigger, same shape as 0047's
# `ops.data_disclosures_guard_mutation`. RLS ENABLE/FORCE/policy is NOT this migration's
# doing — 0012's blanket per-tenant_id-column sweep already covers this table (confirmed live,
