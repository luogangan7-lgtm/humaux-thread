# §46.1 migration manifest. ADR-0018 (§33.10 rule 9 confirm_token gate): one new
# tenant-scoped control table (FORCE RLS, tenant policy, owner role_migration_owner), narrow
# role_gateway grants (SELECT, INSERT, UPDATE(consumed_at)), one owner trigger enforcing
# single-use, and one column-level grant (UPDATE(superseded_at) on private.memory_records)
# so the memory.supersede UPDATE can stamp §9 superseded_at. No DML, no data touched.

migration_id = "0148_confirm_tokens"
class = "EXPAND_CONTRACT"

precheck = """
select to_regclass('control.tenants') is not null
 and to_regclass('control.users') is not null
 and to_regclass('private.memory_records') is not null
 and to_regclass('control.confirm_tokens') is null
 and not has_column_privilege('role_gateway','private.memory_records','superseded_at','UPDATE')
 as precheck_ok
"""

postcheck = """
select to_regclass('control.confirm_tokens') is not null
 and has_table_privilege('role_gateway','control.confirm_tokens','SELECT')
 and has_table_privilege('role_gateway','control.confirm_tokens','INSERT')
 and not has_table_privilege('role_gateway','control.confirm_tokens','UPDATE')
 and has_column_privilege('role_gateway','control.confirm_tokens','consumed_at','UPDATE')
 and not has_column_privilege('role_gateway','control.confirm_tokens','expires_at','UPDATE')
 and not has_table_privilege('role_gateway','control.confirm_tokens','DELETE')
 and has_table_privilege('role_maintenance','control.confirm_tokens','SELECT')
 and not has_table_privilege('role_maintenance','control.confirm_tokens','INSERT')
 and not has_table_privilege('role_private_worker','control.confirm_tokens','SELECT')
 and has_column_privilege('role_gateway','private.memory_records','superseded_at','UPDATE')
 and not has_table_privilege('role_gateway','private.memory_records','UPDATE')
 and exists(select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='control' and c.relname='confirm_tokens'
              and c.relrowsecurity and c.relforcerowsecurity
              and pg_get_userbyid(c.relowner)='role_migration_owner')
 and exists(select 1 from pg_policies where schemaname='control' and tablename='confirm_tokens'
            and cmd='ALL' and qual like '%humaux.tenant_id%' and with_check like '%humaux.tenant_id%')
 and exists(select 1 from pg_trigger where tgrelid='control.confirm_tokens'::regclass
            and tgname='confirm_token_single_use' and not tgisinternal)
 as postcheck_ok
"""

rollback_or_forward_fix = "Forward fix after deployment. A consumed or expired token row is an audit fact for the mutation it gated; never delete rows to reopen a token. Dropping the table also drops every pending confirmation (clients re-request one). The superseded_at column grant is only ever narrowed by a later migration, never widened to table-level UPDATE."
backup_restore_requirement = "none (new empty table + one column-level grant; no row data touched)."
