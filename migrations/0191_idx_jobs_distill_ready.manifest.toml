# §46.1 migration manifest. Card 32 / ADR-0058 D-S: one CONCURRENTLY index, run outside a transaction
# (`transaction = "none"`, honoured by xtask migrate; 0182 precedent). Index-only, no data touched,
# safely droppable.

migration_id = "0191_idx_jobs_distill_ready"
class = "REVERSIBLE"
transaction = "none"

precheck = """
select to_regclass('ops.jobs_distill_ready_idx') is null as precheck_ok
"""

postcheck = """
select coalesce((select indisvalid and indisready
                        and pg_get_expr(indpred, indrelid) like '%DERIVED_DISTILL%'
                        and pg_get_expr(indpred, indrelid) like '%WAITING_KEY%'
                   from pg_index where indexrelid = to_regclass('ops.jobs_distill_ready_idx')), false) as postcheck_ok
"""

rollback_or_forward_fix = "rollback: DROP INDEX CONCURRENTLY IF EXISTS ops.jobs_distill_ready_idx; (also the fix for an INVALID leftover of a failed build, which the precheck refuses by name)"
backup_restore_requirement = "none: index-only DDL built CONCURRENTLY, no row data touched, safely droppable"
