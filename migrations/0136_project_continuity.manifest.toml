  and strpos(pg_get_functiondef(
    'private.publish_continuity_facet(uuid,uuid,uuid,uuid,uuid,text,bigint,text,jsonb,uuid[],bytea[],uuid[],bytea[])'::regprocedure),
    'SELECT count(*) INTO locked_source_count FROM (')>0
  and strpos(pg_get_functiondef(
