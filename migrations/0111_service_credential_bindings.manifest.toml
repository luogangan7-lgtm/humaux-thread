# §73.5.1 service credential bindings. Existing api_keys rows remain legacy and inert:
# this forward-only migration adds nullable binding/snapshot columns and one replacement
# gateway-only lookup; it does not activate, backfill, or widen any credential.

migration_id = "0111_service_credential_bindings"
class = "EXPAND_CONTRACT"

precheck = """
select
  not exists (
    select 1 from information_schema.columns
    where table_schema = 'control' and table_name = 'api_keys'
      and column_name = 'authorization_version'
  )
  and not exists (
    select 1 from pg_constraint
    where conrelid = 'control.workspaces'::regclass
      and conname = 'workspaces_tenant_workspace_key'
  )
  as precheck_ok
"""

postcheck = """
select
  (
    select count(*) from information_schema.columns
    where table_schema = 'control' and table_name = 'api_keys'
      and column_name in (
        'authorization_version', 'user_id', 'workspace_id',
        'tenant_security_epoch', 'user_security_epoch'
      )
  ) = 5
  and exists (
    select 1 from pg_constraint
    where conrelid = 'control.workspaces'::regclass
      and conname = 'workspaces_tenant_workspace_key'
  )
  and exists (
    select 1 from pg_constraint
    where conrelid = 'control.api_keys'::regclass
      and conname = 'api_keys_workspace_same_tenant_fkey'
  )
  and exists (
    select 1 from pg_constraint
    where conrelid = 'control.api_keys'::regclass
      and conname = 'api_keys_authorization_binding_check'
  )
  and position(
    'live_tenant_security_epoch'
    in pg_get_functiondef('control.api_key_lookup(text)'::regprocedure)
  ) > 0
  and position(
    'allowed_cidrs cidr[]'
    in pg_get_functiondef('control.api_key_lookup(text)'::regprocedure)
  ) > 0
  and position(
    'authorization_version IS NOT NULL'
    in pg_get_constraintdef(
      (select oid from pg_constraint
       where conrelid = 'control.api_keys'::regclass
         and conname = 'api_keys_authorization_binding_check')
    )
  ) > 0
  as postcheck_ok
"""

rollback_or_forward_fix = """
Forward fix only after deployment: preserve v1 binding history and use a new migration for
any correction. Before deployment, drop the replacement api_key_lookup(text), the two
api_keys constraints, the workspace composite constraint, and the five added columns.
"""

backup_restore_requirement = "Separate approval and backup before production. This task neither applies the migration nor modifies credential rows."
