# §46.1 migration manifest. Card 32 / ADR-0058 main-line ruling 2026-10-02 20:30 (P2 fixed in the
# third pass): ops.requeue_dead_distill returns one more column, `skipped` (NULL on a re-armed row,
# evidence_gone / outbox_settled on a matching DEAD job class mode left DEAD), and refuses no_dead_job
# only when no DEAD job of the class exists. The return shape changes, so the function is dropped and
# re-created in one transaction: one definer, same (uuid, uuid, text) signature, owner, SECURITY
# DEFINER, pinned search_path and grants. §46 forward-fix (EXPAND_CONTRACT, first free after 0199).

migration_id = "0200_requeue_dead_distill_reports_skips"
class = "EXPAND_CONTRACT"

precheck = """
select coalesce(bool_and(position('skipped' in pg_get_function_result(p.oid)) = 0
   and position('MEMORY_LIFECYCLE' in p.prosrc) > 0), false)
 and count(*) = 1 as precheck_ok
from pg_proc p
where p.oid = to_regprocedure('ops.requeue_dead_distill(uuid,uuid,text)')
"""

postcheck = """
select coalesce(bool_and(
   position('MEMORY_LIFECYCLE' in p.prosrc) > 0
   and position('skipped text' in pg_get_function_result(p.oid)) > 0
   and pg_get_userbyid(p.proowner)='role_migration_owner' and p.prosecdef
   and 'search_path=pg_catalog'=any(coalesce(p.proconfig,'{}'))
   and has_function_privilege('role_maintenance',p.oid,'EXECUTE')
   and not has_function_privilege('role_gateway',p.oid,'EXECUTE')
   and not has_function_privilege('role_retrieval_worker',p.oid,'EXECUTE')
   and not has_function_privilege('role_private_worker',p.oid,'EXECUTE')
   and not has_function_privilege('role_consolidation_worker',p.oid,'EXECUTE')
   and not has_function_privilege('role_public_worker',p.oid,'EXECUTE')
   and not has_function_privilege('role_batch_issuer',p.oid,'EXECUTE')
   and not has_function_privilege('role_admin',p.oid,'EXECUTE')
   and not exists (select 1 from aclexplode(coalesce(p.proacl,acldefault('f',p.proowner))) x
                    where x.grantee=0 and x.privilege_type='EXECUTE')),false)
 and count(*)=1 as postcheck_ok
from pg_proc p
where p.oid = to_regprocedure('ops.requeue_dead_distill(uuid,uuid,text)')
"""

rollback_or_forward_fix = "Forward-fix only: DROP the function and re-run 0198's CREATE OR REPLACE body plus 0197's ALTER OWNER / REVOKE / GRANT (restores the four-column shape; the adapter must then be rolled back with it). No row data is involved."
backup_restore_requirement = "none: replaces one function; no row data is changed."
