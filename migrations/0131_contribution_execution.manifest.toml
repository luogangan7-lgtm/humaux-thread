    and position('ORDER BY source.ordinal' in pg_get_functiondef(
      'private.reserve_contribution_execution_call(uuid,uuid,uuid,text,integer,text,uuid,uuid,bytea,uuid,text,uuid,text,bytea,bigint)'::regprocedure
    ))>0
    and position('inserted_source_count=0' in pg_get_functiondef(
      'private.reserve_contribution_execution_call(uuid,uuid,uuid,text,integer,text,uuid,uuid,bytea,uuid,text,uuid,text,bytea,bigint)'::regprocedure
    ))>0
    and position('inserted_source_count<>root.source_count' in pg_get_functiondef(
      'private.reserve_contribution_execution_call(uuid,uuid,uuid,text,integer,text,uuid,uuid,bytea,uuid,text,uuid,text,bytea,bigint)'::regprocedure
