# Phase 9 R4 adds the durable two-attempt contribution execution authority. It does not
# activate Phase 10, replay a provider call, or add a reconciliation business state.
migration_id = "0131_contribution_execution"
class = "EXPAND_CONTRACT"

precheck = """
select
  to_regclass('private.contribution_executions') is null
  and to_regclass('private.contribution_execution_sources') is null
  and to_regclass('ops.contribution_execution_job_links') is null
  and to_regtype('private.contribution_execution_state') is null
  and to_regclass('ops.jobs') is not null
  and to_regclass('ops.model_call_ledger') is not null
  and to_regclass('ops.data_disclosures') is not null
  and to_regclass('staging.contribution_candidates') is not null
  and to_regclass('staging.contribution_candidate_phase9_assessments') is not null
  and to_regprocedure('control.resolve_user_reasoning_admission(uuid,bigint,uuid,text)') is not null
  and not exists (
    select 1 from pg_attribute
    where attrelid='staging.contribution_candidates'::regclass
      and attname='contribution_execution_id' and not attisdropped
  ) as precheck_ok
"""

