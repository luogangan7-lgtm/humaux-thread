      'private.require_contribution_execution_lease(uuid,uuid,uuid,text,integer)'::regprocedure
    )
  )
  and (
    select count(*)=9 from pg_trigger where not tgisinternal and (tgrelid,tgname) in (
      ('private.contribution_executions'::regclass,'contribution_execution_guard'),
      ('private.contribution_executions'::regclass,'contribution_execution_reject_truncate'),
      ('private.contribution_execution_sources'::regclass,'contribution_execution_sources_append_only'),
