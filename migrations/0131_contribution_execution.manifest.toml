      'ops.contribution_execution_job_links'::regclass
    )
  )
  and (
    select count(*)=18 from pg_constraint where convalidated and conname in (
      'contribution_executions_tenant_execution_unique',
      'contribution_executions_tenant_enqueue_unique',
      'contribution_executions_coverage_request_unique',
