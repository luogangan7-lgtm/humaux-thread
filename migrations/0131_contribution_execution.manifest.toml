      ('ops.contribution_execution_job_links'::regclass,'contribution_execution_job_links_append_only'),
      ('ops.contribution_execution_job_links'::regclass,'contribution_execution_job_links_reject_truncate'),
      ('ops.contribution_execution_job_links'::regclass,'contribution_execution_job_link_validate'),
      ('private.contribution_executions'::regclass,'contribution_execution_manifest_complete'),
      ('private.contribution_execution_sources'::regclass,'contribution_execution_sources_complete')
