# §46.1 migration manifest (G46-1 / G80-37).
# Fixer-review follow-up to 0048_user_reasoning_profiles: RLS predicate split
# (tenant-only reads / tenant+owner writes) and a BEFORE trigger enforcing
# credential_ref's same-tenant invariant — without editing the already-applied 0048.

migration_id = "0060_user_reasoning_profiles_rls_and_credential_tenant"
class = "EXPAND_CONTRACT"

precheck = """
select
  not exists (
    select 1 from pg_trigger
    where tgname = 'user_reasoning_profiles_check_credential_tenant' and not tgisinternal
  )
  as precheck_ok
"""

postcheck = """
select
  (select count(*) from pg_policies
    where schemaname = 'control' and tablename = 'user_reasoning_profiles') = 1
  and exists (
    select 1 from pg_trigger
    where tgname = 'user_reasoning_profiles_check_credential_tenant' and not tgisinternal
      and tgrelid = 'control.user_reasoning_profiles'::regclass
  )
  and to_regprocedure('control.user_reasoning_profiles_check_credential_tenant()') is not null
  as postcheck_ok
"""

rollback_or_forward_fix = """
rollback: DROP TRIGGER IF EXISTS user_reasoning_profiles_check_credential_tenant ON control.user_reasoning_profiles;
          DROP FUNCTION IF EXISTS control.user_reasoning_profiles_check_credential_tenant();
          DROP POLICY user_reasoning_profiles_tenant_and_owner ON control.user_reasoning_profiles;
          -- Restores 0048's original tenant-AND-owner USING/WITH CHECK policy verbatim.
          CREATE POLICY user_reasoning_profiles_tenant_and_owner ON control.user_reasoning_profiles
          USING (
            tenant_id = NULLIF(current_setting('humaux.tenant_id', true), '')::uuid
            AND user_id = NULLIF(current_setting('humaux.user_id', true), '')::uuid
          )
          WITH CHECK (
            tenant_id = NULLIF(current_setting('humaux.tenant_id', true), '')::uuid
            AND user_id = NULLIF(current_setting('humaux.user_id', true), '')::uuid
          );
          (safe — table has zero rows anywhere this migration has run, no INSERT target for it
          exists in the codebase yet)
"""

backup_restore_requirement = "none (policy swap + one new trigger/function, zero rows in the table anywhere this has run)"
