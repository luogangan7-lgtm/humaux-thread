select to_regprocedure('projection.stream_point_ledger(uuid,text,uuid,text,text,text,text,uuid[])') is null
 and to_regprocedure('private.visibility_allowed(text,boolean,boolean,boolean)') is not null
 and to_regclass('control.workspace_memberships') is not null
 and to_regclass('projection.stream_log') is not null
 and to_regclass('ops.outbox') is not null
 as precheck_ok
"""

