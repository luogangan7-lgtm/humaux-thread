# §46.1 migration manifest. Read-only RLS widening for role_retrieval_worker on the two tables the
# projection worker's resolve_memory INNER JOINs: memory_records gets the role clause inside its
# legacy policy (no census on that table); evidence_objects gets a SEPARATE permissive SELECT policy
# because the W1 continuity census (xtask rls-check) pins the legacy policy's text and the policy
# count (5 -> 6, updated in the same commit). Pure DDL, no DML.

migration_id = "0140_memory_records_rls_retrieval_worker_read"
class = "EXPAND_CONTRACT"

precheck = """
select exists (select 1 from pg_policies where schemaname='private' and tablename='memory_records'
                 and policyname='memory_records_tenant_and_visibility'
                 and qual not like '%role_retrieval_worker%')
   and not exists (select 1 from pg_policies where schemaname='private' and tablename='evidence_objects'
                 and policyname='evidence_objects_retrieval_worker_read')
   as precheck_ok
"""

postcheck = """
select has_table_privilege('role_retrieval_worker', 'private.memory_records', 'SELECT')
   and has_table_privilege('role_retrieval_worker', 'private.evidence_objects', 'SELECT')
   and exists (select 1 from pg_policies
        where schemaname='private' and tablename='memory_records'
          and policyname='memory_records_tenant_and_visibility'
          and qual like '%role_retrieval_worker%'
          and qual like '%NULLIF(current_setting(''humaux.tenant_id''::text, true), ''''::text)%'
          and (with_check is null or with_check not like '%role_retrieval_worker%'))
   and exists (select 1 from pg_policies
        where schemaname='private' and tablename='evidence_objects'
          and policyname='evidence_objects_retrieval_worker_read'
          and permissive='PERMISSIVE' and cmd='SELECT'
          and roles = array['role_retrieval_worker']::name[]
          and qual like '%NULLIF(current_setting(''humaux.tenant_id''::text, true), ''''::text)%')
   and (select encode(sha256(convert_to(pg_get_expr(polqual,polrelid),'UTF8')),'hex')
        from pg_policy where polrelid='private.evidence_objects'::regclass
          and polname='evidence_objects_tenant_and_visibility')
       = 'c77b3b830c7abec4ad46704fc7e88cded9a75b028c77ffd1946d2f288d7a045f'
   as postcheck_ok
"""

rollback_or_forward_fix = """
rollback (exact): re-run the memory_records ALTER POLICY ... USING from this file with the single
  line `current_user = 'role_retrieval_worker' OR` removed; DROP POLICY
  evidence_objects_retrieval_worker_read ON private.evidence_objects; restore the W1 census count
  to 5 in xtask/src/rls_check.rs; then DELETE FROM ops.schema_migrations WHERE migration_id =
  '0140_memory_records_rls_retrieval_worker_read'. Restores the P0 (a USER_PRIVATE /
  WORKSPACE_SHARED memory or evidence freezes the tenant's projection_highwater) — forward fix preferred.
"""

backup_restore_requirement = "none (policy definitions only; no row data touched)."
