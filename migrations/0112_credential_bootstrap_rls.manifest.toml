migration_id = "0112_credential_bootstrap_rls"
class = "EXPAND_CONTRACT"

precheck = """
select
  to_regprocedure('control.api_key_lookup(text)') is not null
  and to_regprocedure('control.api_key_touch_last_used(uuid)') is not null
  and not exists (
    select 1 from pg_policies where schemaname = 'control'
      and policyname in ('api_keys_bootstrap_owner_select', 'tenants_bootstrap_owner_select',
                        'memberships_bootstrap_owner_select', 'api_keys_bootstrap_owner_update')
  ) as precheck_ok
"""

postcheck = """
select
  (select count(*) from pg_policies p
   join (values
     ('api_keys', 'api_keys_bootstrap_owner_select', 'SELECT'),
     ('tenants', 'tenants_bootstrap_owner_select', 'SELECT'),
     ('memberships', 'memberships_bootstrap_owner_select', 'SELECT'),
     ('api_keys', 'api_keys_bootstrap_owner_update', 'UPDATE')
   ) expected(table_name, policy_name, command)
     on p.tablename = expected.table_name and p.policyname = expected.policy_name
       and p.cmd = expected.command
   where p.schemaname = 'control'
     and p.roles = array['role_migration_owner']::name[]
     and p.qual = '(CURRENT_USER = ''role_migration_owner''::name)'
     and (p.cmd = 'SELECT' or p.with_check = p.qual)
  ) = 4
  and (select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace
       where n.nspname = 'control' and c.relname in ('api_keys', 'tenants', 'memberships')
         and c.relrowsecurity and c.relforcerowsecurity) = 3
  and not exists (select 1 from pg_roles where rolname = 'role_migration_owner'
                  and (rolsuper or rolbypassrls))
  as postcheck_ok
"""

rollback_or_forward_fix = "Forward fix only after deployment; do not disable FORCE RLS or grant BYPASSRLS. Removing these four owner policies makes service credential authentication unavailable again."
backup_restore_requirement = "Production requires a separate approved backup and rollout. Local acceptance uses only the dedicated service-credentials fixture database. No credential data, role attributes, or grants change."
