# §46.1 migration manifest. Card 33 / ADR-0059 D-A, D-C (audit SEC-2): role_migration_owner becomes
# NOLOGIN with no password; ops.schema_migrations is owner-only; the five ops.email_* tables keep
# exactly the verbs adapters::email::outbox issues. §46 forward-fix (EXPAND_CONTRACT, first free
# after 0200).

migration_id = "0201_secret_hygiene"
class = "EXPAND_CONTRACT"

# Roles are cluster-global: another database on the same cluster may already have turned the owner
# NOLOGIN, so the precheck also keys on a database-local side effect (0011's ops default grant).
precheck = """
select (select rolcanlogin from pg_roles where rolname = 'role_migration_owner')
    or has_table_privilege('role_gateway', 'ops.schema_migrations', 'INSERT')
 as precheck_ok
"""

postcheck = """
with non_owner(r) as (values ('role_gateway'), ('role_private_worker'), ('role_consolidation_worker'),
  ('role_public_worker'), ('role_retrieval_worker'), ('role_batch_issuer'), ('role_maintenance'),
  ('role_admin')),
verb(v) as (values ('SELECT'), ('INSERT'), ('UPDATE'), ('DELETE'), ('TRUNCATE')),
email(t) as (values ('ops.email_outbox'), ('ops.email_delivery_events'), ('ops.email_suppressions'),
  ('ops.email_domains'), ('ops.email_provider_health')),
granted(t, r, v) as (values
  ('ops.email_outbox', 'role_gateway', 'INSERT'),
  ('ops.email_suppressions', 'role_gateway', 'SELECT'),
  ('ops.email_outbox', 'role_private_worker', 'SELECT'),
  ('ops.email_outbox', 'role_private_worker', 'UPDATE'),
  ('ops.email_delivery_events', 'role_private_worker', 'INSERT'),
  ('ops.email_suppressions', 'role_private_worker', 'SELECT'),
  ('ops.email_suppressions', 'role_private_worker', 'INSERT'),
  ('ops.email_suppressions', 'role_private_worker', 'UPDATE'))
select
  (select not rolcanlogin from pg_roles where rolname = 'role_migration_owner')
  and not exists (select 1 from non_owner, verb
                   where has_table_privilege(r, 'ops.schema_migrations', v))
  and not exists (select 1 from non_owner, verb, email
                   where has_table_privilege(r, t, v) <> exists (
                     select 1 from granted g where g.t = email.t and g.r = non_owner.r and g.v = verb.v))
 as postcheck_ok
"""

rollback_or_forward_fix = "forward-fix only (not recommended): ALTER ROLE role_migration_owner LOGIN; re-GRANT the 0011 ops.* domain defaults on ops.schema_migrations and the five ops.email_* tables. That re-opens SEC-2 (a runtime role can forge a migration row) and lets every worker write the email plane."
backup_restore_requirement = "none: one role attribute and table grants; no row data is changed."
