# §46.1 Migration Rehearsal Contract — 每个 migrations/*.sql 恰好一个 manifest（G46-1 / G80-37）。
# 本迁移新建 ops.column_vitality（§9.1 装饰列检测每日探针落地表）；`ops` schema 本身已在
# 0001 迁移建立（CREATE SCHEMA IF NOT EXISTS 保持幂等，非重复所有权声明）。无既有数据形态
# 被替换，因此只有 expand，没有 migrate/backfill/switch/contract 子步骤。

migration_id = "0030_ops_column_vitality"
class = "EXPAND_CONTRACT"

# precheck: 表尚不存在（新建，非重跑）。
precheck = "select to_regclass('ops.column_vitality') is null as precheck_ok"

# postcheck: 表存在且恰有本迁移声明的 7 列。
postcheck = """
select
  to_regclass('ops.column_vitality') is not null
  and (select count(*) from information_schema.columns
       where table_schema = 'ops' and table_name = 'column_vitality') = 7
  as postcheck_ok
"""

# 旧二进制不读写这张新表（§46.1 EXPAND_CONTRACT 要求 old/new binary compatibility），
# 纯加表可安全直接 DROP TABLE 回滚。
rollback_or_forward_fix = "rollback: DROP TABLE IF EXISTS ops.column_vitality;"

# 纯加表、无破坏性变更、无既有数据被改写：常规 pre-deploy snapshot 即可覆盖，
# 不要求专门 restore drill（§46.1 backup_restore_requirement 按风险面裁定）。
backup_restore_requirement = "standard pre-deploy snapshot; no dedicated restore drill required (additive-only DDL, zero rows at risk)"
