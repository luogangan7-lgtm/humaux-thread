# §46.1 migration manifest. ADR-0020 (§36 memory.restore / §37.1 lifecycle log): one new
# append-only ops table (FORCE RLS, tenant policy, owner role_migration_owner) written only
# via one owner SECURITY DEFINER function (EXECUTE to role_gateway; SELECT to
# role_gateway/role_retrieval_worker/role_maintenance), plus one nullable column on
# private.memory_records with a column-level UPDATE grant to role_gateway. No DML, no data
# touched; §46 forward-fix (EXPAND_CONTRACT, next free number after 0148).

migration_id = "0149_memory_lifecycle_events"
class = "EXPAND_CONTRACT"

precheck = """
select to_regclass('control.tenants') is not null
 and to_regclass('private.memory_records') is not null
 and to_regclass('ops.memory_lifecycle_events') is null
 and not exists(select 1 from information_schema.columns
                where table_schema='private' and table_name='memory_records'
                  and column_name='lifecycle_head_event_id')
 as precheck_ok
"""

postcheck = """
select to_regclass('ops.memory_lifecycle_events') is not null
 and has_table_privilege('role_gateway','ops.memory_lifecycle_events','SELECT')
 and not has_table_privilege('role_gateway','ops.memory_lifecycle_events','INSERT')
 and not has_table_privilege('role_gateway','ops.memory_lifecycle_events','UPDATE')
 and not has_table_privilege('role_gateway','ops.memory_lifecycle_events','DELETE')
 and has_table_privilege('role_retrieval_worker','ops.memory_lifecycle_events','SELECT')
 and has_table_privilege('role_maintenance','ops.memory_lifecycle_events','SELECT')
 and not has_table_privilege('role_private_worker','ops.memory_lifecycle_events','SELECT')
 and has_function_privilege('role_gateway',
       'ops.append_memory_lifecycle(uuid,text,uuid,text,text,uuid,uuid,uuid,uuid,timestamptz,text,text,bigint,bigint)',
       'EXECUTE')
 and not has_function_privilege('role_private_worker',
       'ops.append_memory_lifecycle(uuid,text,uuid,text,text,uuid,uuid,uuid,uuid,timestamptz,text,text,bigint,bigint)',
       'EXECUTE')
 and has_column_privilege('role_gateway','private.memory_records','lifecycle_head_event_id','UPDATE')
 and exists(select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='ops' and c.relname='memory_lifecycle_events'
              and c.relrowsecurity and c.relforcerowsecurity
              and pg_get_userbyid(c.relowner)='role_migration_owner')
 and exists(select 1 from pg_policies where schemaname='ops'
            and tablename='memory_lifecycle_events'
            and qual like '%humaux.tenant_id%' and with_check like '%humaux.tenant_id%')
 and exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='ops' and p.proname='append_memory_lifecycle' and p.prosecdef)
 as postcheck_ok
"""

rollback_or_forward_fix = "Forward fix after deployment. The event log is append-only audit history — never DELETE rows to reopen a transition; a RESTORE row is itself the undo record. Dropping the table also drops every undo deadline (pending restores fail closed, which is safe). The lifecycle_head_event_id column grant is only ever narrowed by a later migration, never widened to table-level UPDATE."
backup_restore_requirement = "none (new empty table + one owner function + one nullable column and its column-level grant; no row data touched)."
