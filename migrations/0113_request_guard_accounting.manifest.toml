precheck = """
select to_regclass('control.quota_windows') is not null
 and to_regclass('control.entitlement_snapshots') is not null
 and to_regclass('control.usage_reservations') is null
 and to_regclass('control.rate_buckets') is null as precheck_ok
"""

postcheck = """
select to_regclass('control.usage_reservations') is not null
 and to_regclass('control.rate_buckets') is not null
 and has_function_privilege('role_maintenance', 'control.issue_quota_window(uuid,text)', 'EXECUTE')
 and has_function_privilege('role_maintenance', 'control.reap_quota_reservations(uuid,integer)', 'EXECUTE')
 and not has_function_privilege('role_gateway', 'control.issue_quota_window(uuid,text)', 'EXECUTE')
 and not has_function_privilege('role_gateway', 'control.reap_quota_reservations(uuid,integer)', 'EXECUTE')
 and not has_table_privilege('role_gateway', 'control.quota_windows', 'INSERT')
 and not has_table_privilege('role_maintenance', 'control.quota_windows', 'INSERT')
 and not has_column_privilege('role_gateway', 'control.quota_windows', 'version', 'UPDATE')
 and (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
      where n.nspname='control' and c.relname in ('quota_windows','usage_reservations','rate_buckets')
      and c.relrowsecurity and c.relforcerowsecurity) = 3
 and exists(select 1 from pg_trigger where tgrelid='control.quota_windows'::regclass
            and tgname='quota_window_immutable' and not tgisinternal)
 and exists(select 1 from pg_trigger where tgrelid='control.usage_reservations'::regclass
            and tgname='usage_reservation_transition' and not tgisinternal)
 as postcheck_ok
"""

