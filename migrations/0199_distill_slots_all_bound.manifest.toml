# §46.1 migration manifest. Card 32 / ADR-0058 ruling R5: ops.distill_slots_all_bound(), the
# owner-definer probe `--distill-once` calls after an empty claim to report stopped=no_slot versus
# stopped=no_work. Owner role_migration_owner, SECURITY DEFINER, search_path pinned to pg_catalog,
# PUBLIC has no EXECUTE, role_private_worker is the only non-owner role with EXECUTE. No table grant,
# no DML. §46 forward-fix (EXPAND_CONTRACT, first free after 0198).

migration_id = "0199_distill_slots_all_bound"
class = "EXPAND_CONTRACT"

precheck = """
select to_regprocedure('ops.distill_slots_all_bound()') is null
 and to_regclass('ops.provider_slots') is not null
 as precheck_ok
"""

postcheck = """
select coalesce(bool_and(
   pg_get_userbyid(p.proowner)='role_migration_owner' and p.prosecdef
   and 'search_path=pg_catalog'=any(coalesce(p.proconfig,'{}'))
   and has_function_privilege('role_private_worker',p.oid,'EXECUTE')
   and not has_function_privilege('role_gateway',p.oid,'EXECUTE')
   and not has_function_privilege('role_retrieval_worker',p.oid,'EXECUTE')
   and not has_function_privilege('role_consolidation_worker',p.oid,'EXECUTE')
   and not has_function_privilege('role_public_worker',p.oid,'EXECUTE')
   and not has_function_privilege('role_batch_issuer',p.oid,'EXECUTE')
   and not has_function_privilege('role_maintenance',p.oid,'EXECUTE')
   and not has_function_privilege('role_admin',p.oid,'EXECUTE')
   and not exists (select 1 from aclexplode(coalesce(p.proacl,acldefault('f',p.proowner))) x
                    where x.grantee=0 and x.privilege_type='EXECUTE')),false)
 and count(*)=1 as postcheck_ok
from pg_proc p
where p.oid = to_regprocedure('ops.distill_slots_all_bound()')
"""

rollback_or_forward_fix = "DROP FUNCTION ops.distill_slots_all_bound(). The drain then cannot tell no_slot from no_work (its probe call fails); ship together with the worker that calls it."
backup_restore_requirement = "none: one new function; no row data is changed."
