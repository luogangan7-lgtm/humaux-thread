# as 0036/0048 — EXPAND_CONTRACT with only the expand sub-step.

migration_id = "0050_memory_automation_policies"
class = "EXPAND_CONTRACT"

precheck = "select to_regclass('control.memory_automation_policies') is null as precheck_ok"

