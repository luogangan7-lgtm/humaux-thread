# §46.1 migration manifest. ADR-0030 (Card E1, §8.5.1 affect annotation axis): one new private
# table private.memory_affects (FORCE RLS, tenant + parent-memory policy, owner
# role_migration_owner, NAMED §6.2.2 grants: gateway/private_worker SELECT+INSERT,
# retrieval_worker/maintenance SELECT, nobody UPDATE/DELETE), one owner BEFORE UPDATE trigger
# (+ its function) rejecting every UPDATE. No DML; no existing object touched.
# §46 forward-fix (EXPAND_CONTRACT, next free number after 0155).

migration_id = "0156_memory_affects"
class = "EXPAND_CONTRACT"

precheck = """
select to_regclass('private.memory_records') is not null
 and to_regclass('private.evidence_objects') is not null
 and to_regclass('private.subjects') is not null
 and to_regclass('private.memory_affects') is null
 and to_regprocedure('private.reject_memory_affect_update()') is null
 as precheck_ok
"""

postcheck = """
select
 -- table exists, FORCE RLS, owned by role_migration_owner, tenant policy present
 (select count(*)=1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
   where n.nspname='private' and c.relname='memory_affects'
     and c.relrowsecurity and c.relforcerowsecurity
     and pg_get_userbyid(c.relowner)='role_migration_owner')
 and (select count(*)=1 from pg_policies where schemaname='private' and tablename='memory_affects'
       and qual like '%humaux.tenant_id%' and with_check like '%humaux.tenant_id%')
 -- every FK except the tenant FK carries the tenant leg (composite, >= 2 columns)
 and (select bool_and(array_length(conkey,1) >= 2) from pg_constraint
       where contype='f' and conrelid='private.memory_affects'::regclass
         and confrelid <> 'control.tenants'::regclass)
 and (select count(*)=3 from pg_constraint
       where contype='f' and conrelid='private.memory_affects'::regclass
         and confrelid <> 'control.tenants'::regclass and confdeltype='c')
 -- closed sets + range CHECKs present (§78.2 DB<->Rust contract surface)
 and (select count(*)>=8 from pg_constraint where contype='c' and conrelid='private.memory_affects'::regclass)
 -- immutability trigger, owner function, SECURITY INVOKER
 and (select count(*)=1 from pg_proc p
       where p.oid='private.reject_memory_affect_update()'::regprocedure
         and not p.prosecdef and pg_get_userbyid(p.proowner)='role_migration_owner')
 and exists(select 1 from pg_trigger where tgname='memory_affects_immutable'
             and tgrelid='private.memory_affects'::regclass and not tgisinternal)
 -- NAMED §6.2.2 grants: INSERT for gateway/private_worker, SELECT-only for retrieval/maintenance,
 -- no UPDATE/DELETE for anyone, nothing for the rest
 and has_table_privilege('role_gateway','private.memory_affects','INSERT')
 and has_table_privilege('role_private_worker','private.memory_affects','INSERT')
 and has_table_privilege('role_retrieval_worker','private.memory_affects','SELECT')
 and not has_table_privilege('role_retrieval_worker','private.memory_affects','INSERT')
 and has_table_privilege('role_maintenance','private.memory_affects','SELECT')
 and not has_table_privilege('role_maintenance','private.memory_affects','INSERT')
 and not has_table_privilege('role_gateway','private.memory_affects','UPDATE')
 and not has_table_privilege('role_gateway','private.memory_affects','DELETE')
 and not has_table_privilege('role_private_worker','private.memory_affects','UPDATE')
 and not has_table_privilege('role_private_worker','private.memory_affects','DELETE')
 and not has_table_privilege('role_consolidation_worker','private.memory_affects','SELECT')
 and not has_table_privilege('role_public_worker','private.memory_affects','SELECT')
 and not has_table_privilege('role_batch_issuer','private.memory_affects','SELECT')
 and not has_table_privilege('role_admin','private.memory_affects','SELECT')
 as postcheck_ok
"""

rollback_or_forward_fix = "Forward fix after deployment. memory_affects rows are annotations re-issuable through memory.annotate_affect from their callers' inputs and carry no lifecycle history; a forward migration may drop the trigger, its function and the table in that order if the card is reverted. Grants are only ever narrowed by a later migration."
backup_restore_requirement = "none (new empty table + trigger/grants; no existing row or policy is touched)."
