# §46.1 migration manifest. ADR-0028 (Card 8, §6.1.3 memory<->subject linkage + deterministic
# resolve hook): four new private tables (evidence_subjects / memory_subjects /
# memory_subject_mentions / memory_rollup_subjects — FORCE RLS, tenant + parent policy, owner
# role_migration_owner, NAMED §6.2.2 grants), one constrained-redundancy UNIQUE on memory_rollups,
# two SECURITY INVOKER hook functions + one AFTER UPDATE trigger (and its function) on
# memory_records. No DML;
# §46 forward-fix (EXPAND_CONTRACT, next free number after 0153).

migration_id = "0154_memory_subjects"
class = "EXPAND_CONTRACT"

precheck = """
select to_regclass('private.subjects') is not null
 and to_regclass('private.subject_keys') is not null
 and to_regclass('private.memory_records') is not null
 and to_regclass('private.memory_rollups') is not null
 and to_regclass('private.evidence_objects') is not null
 and to_regclass('private.evidence_subjects') is null
 and to_regclass('private.memory_subjects') is null
 and to_regclass('private.memory_subject_mentions') is null
 and to_regclass('private.memory_rollup_subjects') is null
 and to_regprocedure('private.link_memory_subjects(uuid,uuid,uuid[],text[])') is null
 as precheck_ok
"""

postcheck = """
select
 -- four tables exist, FORCE RLS, owned by role_migration_owner, tenant policy present
 (select count(*)=4 from pg_class c join pg_namespace n on n.oid=c.relnamespace
   where n.nspname='private'
     and c.relname in ('evidence_subjects','memory_subjects','memory_subject_mentions','memory_rollup_subjects')
     and c.relrowsecurity and c.relforcerowsecurity
     and pg_get_userbyid(c.relowner)='role_migration_owner')
 and (select count(*)=4 from pg_policies where schemaname='private'
       and tablename in ('evidence_subjects','memory_subjects','memory_subject_mentions','memory_rollup_subjects')
       and qual like '%humaux.tenant_id%' and with_check like '%humaux.tenant_id%')
 -- every child FK carries the tenant leg (composite, >= 2 columns)
 and (select bool_and(array_length(conkey,1) >= 2) from pg_constraint
       where contype='f' and conrelid in ('private.evidence_subjects'::regclass,
         'private.memory_subjects'::regclass,'private.memory_subject_mentions'::regclass,
         'private.memory_rollup_subjects'::regclass)
         and confrelid <> 'control.tenants'::regclass)
 and (select count(*)=1 from pg_constraint where conname='memory_rollups_tenant_id_unique')
 -- hook functions + trigger, owner role_migration_owner, SECURITY INVOKER (never a definer bypass)
 and (select count(*)=3 from pg_proc p
       where p.oid in ('private.link_memory_subjects(uuid,uuid,uuid[],text[])'::regprocedure,
                       'private.link_rollup_subjects(uuid,uuid)'::regprocedure,
                       'private.memory_subjects_on_supersede()'::regprocedure)
         and not p.prosecdef and pg_get_userbyid(p.proowner)='role_migration_owner')
 and exists(select 1 from pg_trigger where tgname='memory_subjects_on_supersede'
             and tgrelid='private.memory_records'::regclass and not tgisinternal)
 -- NAMED §6.2.2 grants
 and has_table_privilege('role_gateway','private.evidence_subjects','INSERT')
 and not has_table_privilege('role_private_worker','private.evidence_subjects','INSERT')
 and has_table_privilege('role_private_worker','private.memory_subjects','INSERT')
 and has_table_privilege('role_gateway','private.memory_subject_mentions','INSERT')
 and has_table_privilege('role_consolidation_worker','private.memory_subjects','SELECT')
 and not has_table_privilege('role_consolidation_worker','private.memory_subjects','INSERT')
 and has_table_privilege('role_consolidation_worker','private.memory_rollup_subjects','INSERT')
 and not has_table_privilege('role_gateway','private.memory_rollup_subjects','INSERT')
 and has_table_privilege('role_retrieval_worker','private.memory_subjects','SELECT')
 and not has_table_privilege('role_public_worker','private.memory_subjects','SELECT')
 and not has_table_privilege('role_batch_issuer','private.memory_subjects','SELECT')
 and not has_table_privilege('role_admin','private.memory_subjects','SELECT')
 and not has_table_privilege('role_maintenance','private.memory_subjects','INSERT')
 as postcheck_ok
"""

rollback_or_forward_fix = "Forward fix after deployment. The four linkage tables are derivable from their writers' inputs (declarations are re-issuable, memory/rollup links are recomputable by re-running the hook over memory_evidence / memory_rollup_sources) and carry no unique history; a forward migration may drop the trigger, the three functions (two hooks + the trigger function), the four tables and the memory_rollups UNIQUE in that order if the card is reverted. Grants are only ever narrowed by a later migration."
backup_restore_requirement = "none (new empty tables + functions/trigger/grants; the memory_rollups UNIQUE touches no row data — existing rollup ids are already unique)."
