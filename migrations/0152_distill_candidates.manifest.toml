# §46.1 migration manifest. ADR-0026 (Card 6, §10.1 distill candidate queue): one new private
# table `private.distill_candidates` (FORCE RLS, tenant policy, owner role_migration_owner) with
# NAMED §6.2.2 grants (private_worker SELECT,INSERT; gateway SELECT + UPDATE(state,
# confirmed_memory_id); maintenance SELECT + UPDATE(state); every other role —), two indexes, and
# nothing else. No DML, no existing object touched; §46 forward-fix (EXPAND_CONTRACT, next free
# number after 0151).

migration_id = "0152_distill_candidates"
class = "EXPAND_CONTRACT"

precheck = """
select to_regclass('control.tenants') is not null
 and to_regclass('private.evidence_objects') is not null
 and to_regclass('private.memory_records') is not null
 and to_regclass('private.distill_candidates') is null
 as precheck_ok
"""

postcheck = """
select to_regclass('private.distill_candidates') is not null
 and has_table_privilege('role_private_worker','private.distill_candidates','SELECT')
 and has_table_privilege('role_private_worker','private.distill_candidates','INSERT')
 and not has_table_privilege('role_private_worker','private.distill_candidates','UPDATE')
 and has_table_privilege('role_gateway','private.distill_candidates','SELECT')
 and not has_table_privilege('role_gateway','private.distill_candidates','INSERT')
 and not has_table_privilege('role_gateway','private.distill_candidates','UPDATE')
 and has_column_privilege('role_gateway','private.distill_candidates','state','UPDATE')
 and has_column_privilege('role_gateway','private.distill_candidates','confirmed_memory_id','UPDATE')
 and not has_column_privilege('role_gateway','private.distill_candidates','rejection_reason','UPDATE')
 and has_table_privilege('role_maintenance','private.distill_candidates','SELECT')
 and has_column_privilege('role_maintenance','private.distill_candidates','state','UPDATE')
 and not has_column_privilege('role_maintenance','private.distill_candidates','confirmed_memory_id','UPDATE')
 and not has_table_privilege('role_consolidation_worker','private.distill_candidates','SELECT')
 and not has_table_privilege('role_retrieval_worker','private.distill_candidates','SELECT')
 and not has_table_privilege('role_public_worker','private.distill_candidates','SELECT')
 and exists(select 1 from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='private' and c.relname='distill_candidates'
              and c.relrowsecurity and c.relforcerowsecurity
              and pg_get_userbyid(c.relowner)='role_migration_owner')
 and exists(select 1 from pg_policies where schemaname='private'
            and tablename='distill_candidates'
            and qual like '%humaux.tenant_id%' and with_check like '%humaux.tenant_id%')
 as postcheck_ok
"""

rollback_or_forward_fix = "Forward fix after deployment. The queue is derivable state (its rows come from the Distill hop) and carries no unique history, so dropping the table simply disables memory.confirm until re-created; no data must be preserved. The gateway/maintenance column grants are only ever narrowed by a later migration, never widened to table-level UPDATE."
backup_restore_requirement = "none (new empty table + two indexes + its grants; no row data touched)."
