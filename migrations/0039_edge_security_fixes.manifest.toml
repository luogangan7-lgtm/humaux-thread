# §46.1 migration manifest (G46-1 / G80-37). Fixer-review follow-up to 0035_edge_security:
# closes the missing-RLS blocker on control.support_access_requests and the
# read-dead/write-dead control.api_keys gap, without editing the already-applied 0035.

migration_id = "0039_edge_security_fixes"
class = "EXPAND_CONTRACT"

precheck = """
select
  (select relrowsecurity from pg_class
     where oid = 'control.support_access_requests'::regclass) = false
  and to_regprocedure('control.api_key_lookup(text)') is null
  and to_regprocedure('control.api_key_touch_last_used(uuid)') is null
  as precheck_ok
"""

postcheck = """
select
  (select relrowsecurity and relforcerowsecurity from pg_class
     where oid = 'control.support_access_requests'::regclass) = true
  and (select count(*) from pg_policies
       where schemaname = 'control' and tablename = 'support_access_requests') = 0
  and to_regprocedure('control.api_key_lookup(text)') is not null
  and to_regprocedure('control.api_key_touch_last_used(uuid)') is not null
  as postcheck_ok
"""

rollback_or_forward_fix = """
rollback: ALTER TABLE control.support_access_requests DISABLE ROW LEVEL SECURITY;
          DROP FUNCTION IF EXISTS control.api_key_lookup(text);
          DROP FUNCTION IF EXISTS control.api_key_touch_last_used(uuid);
"""

backup_restore_requirement = "standard pre-deploy snapshot; no dedicated restore drill required (RLS enable + two SECURITY DEFINER functions, no data touched)"
