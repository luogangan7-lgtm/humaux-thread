[package]
name = "humaux-private-worker"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# T4.4/T4.5 §11/§11.1: this binary is the one process allowed to hold both `PrivateWorkerDbPool`
# (role_private_worker, §6.2.1 R+W on `private.*`) and BYOK decrypt capability
# (`humaux_adapters::byok`/`openbao`, §11.1 "仅 humaux-private-worker 在最贴近 adapter 处解密")
# — unlike `humaux-consolidation-worker`, which deliberately has no path to either (see that
# binary's own Cargo.toml comment). This skeleton only wires the DB pool; the BYOK provider
# client and its OpenBao/transport backends are pending wiring (openbao.rs / infra-egress's
# richer transport are still stubs, see `crates/adapters/src/byok.rs`'s module doc).
humaux-adapters = { path = "../../crates/adapters" }
humaux-application = { path = "../../crates/application" }
humaux-domain = { path = "../../crates/domain" }
humaux-infra-cell = { path = "../../crates/infra-cell" }
# §11.8 `inference_rpc.rs`: `axum::serve` over a `tokio::net::UnixListener` (axum 0.8 native
# `Listener` impl) — same pin `bins/retrieval-worker`'s own ADR-0012 RPC transport already uses.
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
uuid = { version = "1.25.0", features = ["serde"] }

[dev-dependencies]
async-trait = "0.1"
postgres = { version = "0.19", features = ["with-uuid-1", "with-serde_json-1"] }
uuid = { version = "1.25.0", features = ["v4"] }
